<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCS Quote Builder</title>
<style>
  :root{
    --red:#C81010; --red-dark:#9E0C0C; --ink:#161616; --ink-2:#262626;
    --paper:#ffffff; --bg:#11100F; --panel:#1b1a18; --panel-2:#222120;
    --line:#34322f; --muted:#8d8881; --text:#ece9e4; --gold:#FFF200;
    --field:#2a2825; --field-focus:#322f2b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* ---- top bar ---- */
  .topbar{
    height:58px; background:var(--ink); border-bottom:2px solid var(--red);
    display:flex; align-items:center; gap:18px; padding:0 20px; position:relative; z-index:5;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{
    width:30px;height:30px;border-radius:4px;background:var(--red);
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;
    box-shadow:0 2px 8px rgba(200,16,16,.4);
  }
  .brand b{font-size:14.5px;letter-spacing:.04em;font-weight:700}
  .brand b span{color:var(--red)}
  .brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:1px}
  .topbar .spacer{flex:1}
  .tb-btn{
    background:transparent;border:1px solid var(--line);color:var(--text);
    padding:8px 15px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:.15s;letter-spacing:.01em;
  }
  .tb-btn:hover{border-color:var(--muted);background:var(--panel-2)}
  .tb-btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .tb-btn.primary:hover{background:var(--red-dark)}
  .tb-btn svg{width:15px;height:15px}

  /* ---- layout ---- */
  .stage{display:flex;height:calc(100vh - 58px)}
  .editor{
    width:46%;min-width:430px;max-width:680px;overflow-y:auto;
    background:var(--panel);border-right:1px solid var(--line);padding:22px 24px 80px;
  }
  .preview-pane{flex:1;overflow-y:auto;background:#2c2a28;display:flex;justify-content:center;padding:34px 20px 60px}

  /* ---- editor sections ---- */
  .grp{margin-bottom:22px}
  .grp-head{
    display:flex;align-items:center;gap:9px;margin-bottom:13px;
    font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  }
  .grp-head::before{content:"";width:3px;height:14px;background:var(--red);border-radius:2px}
  .row{display:flex;gap:11px;margin-bottom:11px}
  .row.tri{flex-wrap:wrap}
  .fld{flex:1;min-width:0}
  .fld.sm{flex:0 0 140px}
  label{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase}
  input,textarea{
    width:100%;background:var(--field);border:1px solid transparent;border-radius:6px;
    color:var(--text);font-size:13.5px;padding:9px 11px;font-family:inherit;transition:.13s;
  }
  input:focus,textarea:focus{outline:none;background:var(--field-focus);border-color:var(--red)}
  input::placeholder,textarea::placeholder{color:#6a655e}
  textarea{resize:vertical;min-height:54px;line-height:1.5}

  /* line items */
  .items{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;gap:8px;align-items:center}
  .item .desc{flex:1}
  .item .amt{flex:0 0 120px}
  .item .amt-wrap{position:relative}
  .item .amt-wrap::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
  .item .amt-wrap input{padding-left:21px;text-align:right}
  .del-row{
    flex:0 0 30px;height:36px;border:1px solid var(--line);background:transparent;border-radius:6px;
    color:var(--muted);cursor:pointer;font-size:16px;line-height:1;transition:.13s;display:grid;place-items:center;
  }
  .del-row:hover{border-color:var(--red);color:var(--red);background:rgba(200,16,16,.08)}
  .add-row{
    margin-top:9px;background:transparent;border:1px dashed var(--line);color:var(--muted);
    padding:8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:.13s;
  }
  .add-row:hover{border-color:var(--red);color:var(--red)}

  .subtotal-tag{
    margin-top:11px;display:flex;justify-content:space-between;align-items:center;
    padding:9px 12px;background:var(--panel-2);border-radius:6px;font-size:12.5px;
  }
  .subtotal-tag b{font-size:14px}

  /* ---- preview document ---- */
  .doc{
    width:8.5in;min-height:11in;background:var(--paper);color:#1a1a1a;
    box-shadow:0 12px 40px rgba(0,0,0,.5);padding:0.9in;font-size:10pt;line-height:1.4;
    transform-origin:top center;
  }
  .doc *{font-family:Arial,Helvetica,sans-serif}
  .doc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .doc-logo{width:2.2in;max-height:1.5in;object-fit:contain}
  .doc-logo-fallback{
    width:2.2in;height:1.4in;background:var(--ink);border-radius:6px;display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:18px;letter-spacing:.04em;text-align:center;line-height:1.15;
  }
  .doc-logo-fallback span{color:var(--red)}
  .doc-co{text-align:right}
  .doc-co .nm{font-size:16pt;font-weight:700;color:#1a1a1a}
  .doc-co .ad{font-size:9pt;color:#808080}
  .rule{height:2.2px;background:var(--red);margin:6px 0 12px}
  .doc-title-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
  .doc-title{font-size:25pt;font-weight:800;color:#1a1a1a;line-height:1}
  .doc-sub{font-size:11pt;font-style:italic;color:var(--red);margin-top:3px}
  .doc-meta{text-align:right;font-size:9pt}
  .doc-meta div{margin-bottom:2px}
  .doc-meta b{color:#808080;font-weight:700}
  .info-cols{display:flex;gap:18px;margin-bottom:16px}
  .info-col{flex:1}
  .sec-bar{background:#f0f0f0;padding:6px 9px;font-size:10pt;font-weight:700;color:#1a1a1a;display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .sec-bar::before{content:"";width:3px;height:13px;background:var(--red)}
  .kv{display:flex;border-bottom:.5px solid #ddd;padding:3px 0;font-size:9.5pt}
  .kv .k{width:1.15in;flex:0 0 1.15in;font-size:8pt;font-weight:700;color:#808080;text-transform:uppercase;padding-top:2px}
  .kv .v{flex:1}
  .kv .v.red{color:var(--red);font-weight:700}
  table.lt{width:100%;border-collapse:collapse;margin-bottom:0}
  table.lt th{background:#202020;color:#fff;font-size:9pt;text-align:left;padding:7px 10px}
  table.lt th.r{text-align:right}
  table.lt td{padding:6px 10px;font-size:10pt;border-bottom:.5px solid #e5e5e5}
  table.lt td.r{text-align:right}
  table.lt tr:nth-child(even) td{background:#f7f7f7}
  .sub-line{height:1.2px;background:var(--red);margin:0}
  .sub-row{display:flex;justify-content:space-between;padding:6px 10px;font-weight:700;font-size:10.5pt}
  .sub-row .hl{background:var(--gold);padding:1px 6px}
  .total-row{display:flex;justify-content:space-between;background:#202020;color:#fff;padding:9px 10px;font-weight:700;margin:14px 0;align-items:center}
  .total-row .lbl{font-size:12pt}
  .total-row .amt{font-size:13pt}
  .terms div{font-size:9.5pt;margin-bottom:3px}
  .terms b{font-weight:700}
  .doc-foot{text-align:center;font-size:8.5pt;color:#808080;font-style:italic;margin-top:14px}
  .gap{height:13px}

  /* jobs drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;backdrop-filter:blur(2px)}
  .overlay.show{display:block}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:480px;max-width:92vw;background:var(--panel);
    z-index:21;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;border-left:1px solid var(--line);
  }
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .drawer-head h2{font-size:14px;letter-spacing:.04em;font-weight:700}
  .drawer-head .x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .search{padding:14px 20px;border-bottom:1px solid var(--line)}
  .search input{background:var(--field)}
  .jobs-list{flex:1;overflow-y:auto;padding:10px 14px}
  .job{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:13px 14px;margin-bottom:9px;
    cursor:pointer;transition:.13s;position:relative;
  }
  .job:hover{border-color:var(--red)}
  .job .co{font-size:13.5px;font-weight:700;margin-bottom:2px}
  .job .mc{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .job .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
  .job .tot{color:var(--gold);font-weight:700;font-size:12.5px}
  .job-actions{position:absolute;top:10px;right:10px;display:flex;gap:5px;opacity:0;transition:.13s}
  .job:hover .job-actions{opacity:1}
  .ja{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:12px}
  .ja:hover{border-color:var(--red);color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:13px;line-height:1.6}

  /* toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);border:1px solid var(--red);color:#fff;padding:11px 20px;border-radius:8px;
    font-size:13px;font-weight:600;z-index:40;transition:.25s;opacity:0;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  .hint{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .preview-scale-note{position:absolute;top:10px;right:18px;font-size:10px;color:#888;letter-spacing:.08em;text-transform:uppercase}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#3a3733;border-radius:6px;border:2px solid var(--panel)}
  ::-webkit-scrollbar-thumb:hover{background:#4a4641}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="mark">G</div>
      <div>
        <b>GRINDER<span>CRUSHER</span>SCREEN</b>
        <small>Quote Builder</small>
      </div>
    </div>
    <div class="spacer"></div>
    <a class="tb-btn" href="/conveyor" title="Conveyor quotes with Firecrawl extract" style="text-decoration:none">Conveyor Quotes</a>
    <button class="tb-btn" id="btnNew" title="Start a blank quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New
    </button>
    <button class="tb-btn" id="btnJobs" title="Open saved quotes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg>Saved Quotes
    </button>
    <button class="tb-btn" id="btnSave" title="Save to this machine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Save
    </button>
    <button class="tb-btn" id="btnDocx" title="Download editable Word file">DOCX</button>
    <button class="tb-btn primary" id="btnPdf" title="Download finished PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>PDF
    </button>
  </div>

  <div class="stage">
    <!-- EDITOR -->
    <div class="editor" id="editor">
      <div class="grp">
        <div class="grp-head">Quote Details</div>
        <div class="row">
          <div class="fld"><label>Date</label><input id="date"></div>
          <div class="fld"><label>Valid Until</label><input id="valid_until"></div>
        </div>
        <div class="fld"><label>Subtitle</label><input id="subtitle"></div>
      </div>

      <div class="grp">
        <div class="grp-head">Prepared By</div>
        <div class="fld" style="margin-bottom:11px"><label>Name</label><input id="rep_name"></div>
        <div class="row">
          <div class="fld"><label>Title</label><input id="rep_title"></div>
          <div class="fld sm"><label>Mobile</label><input id="rep_mobile"></div>
        </div>
        <div class="hint">Tip: these stay filled in for the next quote automatically.</div>
      </div>

      <div class="grp">
        <div class="grp-head">Customer</div>
        <div class="row">
          <div class="fld"><label>Contact Name</label><input id="cust_name" placeholder="Tariq Harland"></div>
          <div class="fld"><label>Company</label><input id="cust_company" placeholder="Taza Supplies"></div>
        </div>
        <div class="row">
          <div class="fld"><label>City / State</label><input id="cust_city" placeholder="South Holland, IL"></div>
          <div class="fld"><label>Email</label><input id="cust_email" placeholder="tariq@tazasupplies.com"></div>
        </div>
      </div>

      <div class="grp">
        <div class="grp-head">Equipment & Pricing</div>
        <div class="items" id="eqItems"></div>
        <button class="add-row" id="addEq">+ Add equipment line</button>
        <div class="subtotal-tag">Equipment Subtotal <b id="eqSub">$0</b></div>
      </div>

      <div class="grp">
        <div class="grp-head">Freight</div>
        <div class="items" id="frItems"></div>
        <button class="add-row" id="addFr">+ Add freight line</button>
        <div class="subtotal-tag">Freight Subtotal <b id="frSub">$0</b></div>
      </div>

      <div class="grp">
        <div class="grp-head">Notes & Terms</div>
        <div class="fld" style="margin-bottom:11px"><label>Payment Terms</label><input id="payment_terms"></div>
        <div class="fld" style="margin-bottom:11px"><label>Lead Time</label><input id="lead_time" placeholder="5 Days"></div>
        <div class="fld" style="margin-bottom:11px"><label>Freight Note</label><textarea id="freight_note"></textarea></div>
        <div class="fld"><label>Additional Notes</label><textarea id="additional_notes" placeholder="No warranty is available for this unit."></textarea></div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-pane">
      <div class="preview-scale-note">Live preview</div>
      <div class="doc" id="doc"></div>
    </div>
  </div>

  <!-- JOBS DRAWER -->
  <div class="overlay" id="overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <h2>Saved Quotes</h2>
      <button class="x" id="closeDrawer">×</button>
    </div>
    <div class="search"><input id="jobSearch" placeholder="Search by company, contact, or machine…"></div>
    <div class="jobs-list" id="jobsList"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let state = {};
let currentId = null;
let allJobs = [];

const FIELDS = ['date','valid_until','subtitle','rep_name','rep_title','rep_mobile',
  'cust_name','cust_company','cust_city','cust_email',
  'payment_terms','lead_time','freight_note','additional_notes'];

function money(v){
  const n = parseFloat(String(v).replace(/[$,]/g,'').trim()||0)||0;
  return n % 1 === 0 ? '$'+n.toLocaleString('en-US') : '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function num(v){ return parseFloat(String(v).replace(/[$,]/g,'').trim()||0)||0; }

// ---- line item rendering ----
function renderItems(which){
  const wrap = which==='eq' ? $('eqItems') : $('frItems');
  const items = which==='eq' ? state.equipment_items : state.freight_items;
  wrap.innerHTML='';
  items.forEach((it,i)=>{
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`
      <input class="desc" placeholder="Description" value="${escapeAttr(it.desc||'')}">
      <div class="amt amt-wrap"><input placeholder="0" value="${escapeAttr(it.amount||'')}"></div>
      <button class="del-row" title="Remove line">×</button>`;
    const [descIn, amtIn] = div.querySelectorAll('input');
    descIn.addEventListener('input',e=>{it.desc=e.target.value;syncPreview();});
    amtIn.addEventListener('input',e=>{it.amount=e.target.value;recalc();syncPreview();});
    div.querySelector('.del-row').addEventListener('click',()=>{
      items.splice(i,1);
      if(items.length===0) items.push({desc:'',amount:''});
      renderItems(which);recalc();syncPreview();
    });
    wrap.appendChild(div);
  });
}
function escapeAttr(s){return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function recalc(){
  const eq = state.equipment_items.reduce((s,i)=>s+num(i.amount),0);
  const fr = state.freight_items.reduce((s,i)=>s+num(i.amount),0);
  $('eqSub').textContent=money(eq);
  $('frSub').textContent=money(fr);
  return {eq,fr,total:eq+fr};
}

// ---- live preview ----
function syncPreview(){
  const t = recalc();
  const eqRows = (state.equipment_items.length?state.equipment_items:[{desc:'',amount:''}]).map(i=>
    `<tr><td>${escapeHtml(i.desc)}</td><td class="r">${i.amount!==''&&i.amount!=null?money(i.amount):''}</td></tr>`).join('');
  const frRows = (state.freight_items.length?state.freight_items:[{desc:'',amount:''}]).map(i=>
    `<tr><td>${escapeHtml(i.desc)}</td><td class="r">${i.amount!==''&&i.amount!=null?money(i.amount):''}</td></tr>`).join('');

  const logoHtml = `<img class="doc-logo" src="/logo" onerror="this.outerHTML='&lt;div class=\\'doc-logo-fallback\\'&gt;GRINDER&lt;br&gt;&lt;span&gt;CRUSHER&lt;/span&gt;&lt;br&gt;SCREEN&lt;/div&gt;'">`;

  const terms = [
    ['Payment Terms:', state.payment_terms],
    ['Lead Time:', state.lead_time],
    ['Freight Note:', state.freight_note],
    ['Additional Notes:', state.additional_notes],
  ].filter(([_,v])=>v&&v.trim()).map(([k,v])=>`<div><b>${k}</b> ${escapeHtml(v)}</div>`).join('');

  $('doc').innerHTML = `
    <div class="doc-head">
      ${logoHtml}
      <div class="doc-co">
        <div class="nm">${escapeHtml(state.company_name||'GrinderCrusherScreen')}</div>
        <div class="ad">${escapeHtml(state.company_address||'')}</div>
        <div class="ad">${escapeHtml(state.company_phone||'')}</div>
      </div>
    </div>
    <div class="rule"></div>
    <div class="doc-title-row">
      <div>
        <div class="doc-title">SALES QUOTATION</div>
        <div class="doc-sub">${escapeHtml(state.subtitle||'')}</div>
      </div>
      <div class="doc-meta">
        <div><b>Date</b> ${escapeHtml(state.date||'')}</div>
        <div><b>Valid Until</b> ${escapeHtml(state.valid_until||'')}</div>
      </div>
    </div>
    <div class="info-cols">
      <div class="info-col">
        <div class="sec-bar">PREPARED BY</div>
        <div class="kv"><div class="k">Name</div><div class="v">${escapeHtml(state.rep_name||'')}</div></div>
        <div class="kv"><div class="k">Title</div><div class="v">${escapeHtml(state.rep_title||'')}</div></div>
        <div class="kv"><div class="k">Mobile</div><div class="v red">${escapeHtml(state.rep_mobile||'')}</div></div>
      </div>
      <div class="info-col">
        <div class="sec-bar">CUSTOMER INFORMATION</div>
        <div class="kv"><div class="k">Name</div><div class="v">${escapeHtml(state.cust_name||'')}</div></div>
        <div class="kv"><div class="k">Company</div><div class="v">${escapeHtml(state.cust_company||'')}</div></div>
        <div class="kv"><div class="k">City / State</div><div class="v">${escapeHtml(state.cust_city||'')}</div></div>
        <div class="kv"><div class="k">Email</div><div class="v">${escapeHtml(state.cust_email||'')}</div></div>
      </div>
    </div>
    <div class="sec-bar">EQUIPMENT & PRICING</div>
    <table class="lt"><tr><th>DESCRIPTION</th><th class="r">AMOUNT</th></tr>${eqRows}</table>
    <div class="sub-line"></div>
    <div class="sub-row"><span>Equipment Subtotal</span><span class="hl">${money(t.eq)}</span></div>
    <div class="gap"></div>
    <div class="sec-bar">FREIGHT ESTIMATE</div>
    <table class="lt"><tr><th>DESCRIPTION</th><th class="r">ESTIMATED COST</th></tr>${frRows}</table>
    <div class="sub-row"><span>Freight Subtotal</span><span>${money(t.fr)}</span></div>
    <div class="total-row"><span class="lbl">TOTAL ESTIMATE</span><span class="amt">${money(t.total)}</span></div>
    <div class="sec-bar">NOTES & TERMS</div>
    <div class="terms">${terms||'<div style="color:#aaa">—</div>'}</div>
    <div class="doc-foot">${escapeHtml(state.footer||'')}</div>
  `;
}

// ---- bind simple fields ----
function bindFields(){
  FIELDS.forEach(f=>{
    const el=$(f); if(!el) return;
    el.addEventListener('input',e=>{state[f]=e.target.value;syncPreview();});
  });
}
function fillForm(){
  FIELDS.forEach(f=>{ if($(f)) $(f).value = state[f]||''; });
  renderItems('eq'); renderItems('fr');
  syncPreview();
}

// ---- load defaults / job ----
async function loadDefaults(){
  const r = await fetch('/api/defaults'); state = await r.json();
  state.equipment_items = state.equipment_items||[{desc:'',amount:''}];
  state.freight_items = state.freight_items||[{desc:'',amount:''}];
  currentId=null; fillForm();
}
async function loadJob(id){
  const r = await fetch('/api/job?id='+encodeURIComponent(id));
  if(!r.ok){toast('Could not open that quote');return;}
  state = await r.json(); currentId = id;
  state.equipment_items = state.equipment_items&&state.equipment_items.length?state.equipment_items:[{desc:'',amount:''}];
  state.freight_items = state.freight_items&&state.freight_items.length?state.freight_items:[{desc:'',amount:''}];
  fillForm(); closeDrawer(); toast('Opened quote');
}

// ---- save ----
async function saveQuote(silent){
  state._id = currentId; // null = new
  const r = await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
  const j = await r.json();
  if(j.ok){ currentId=j.id; state._id=j.id; if(!silent) toast('Saved'); return true; }
  toast('Save failed'); return false;
}

// ---- download ----
async function download(fmt){
  const ok = await saveQuote(true);
  if(!ok) return;
  toast('Building '+fmt.toUpperCase()+'…');
  window.location = '/download?id='+encodeURIComponent(currentId)+'&fmt='+fmt;
}

// ---- jobs drawer ----
async function openDrawer(){
  $('overlay').classList.add('show'); $('drawer').classList.add('show');
  const r = await fetch('/api/jobs'); allJobs = await r.json(); renderJobs(allJobs);
}
function closeDrawer(){$('overlay').classList.remove('show');$('drawer').classList.remove('show');}
function renderJobs(jobs){
  const list=$('jobsList');
  if(!jobs.length){list.innerHTML='<div class="empty">No saved quotes yet.<br>Fill out a quote and hit <b>Save</b>.</div>';return;}
  list.innerHTML = jobs.map(j=>`
    <div class="job" data-id="${j.id}">
      <div class="job-actions">
        <button class="ja dup" title="Duplicate as new">⧉</button>
        <button class="ja del" title="Delete">🗑</button>
      </div>
      <div class="co">${escapeHtml(j.cust_company||j.cust_name||'(no customer)')}</div>
      <div class="mc">${escapeHtml(j.machine||'')}${j.cust_name&&j.cust_company?' · '+escapeHtml(j.cust_name):''}</div>
      <div class="meta"><span>${escapeHtml(j.date||'')} · ${escapeHtml(j.rep_name||'')}</span><span class="tot">${money(j.total||0)}</span></div>
    </div>`).join('');
  list.querySelectorAll('.job').forEach(card=>{
    const id=card.dataset.id;
    card.addEventListener('click',e=>{
      if(e.target.closest('.dup')){dupJob(id);return;}
      if(e.target.closest('.del')){delJob(id);return;}
      loadJob(id);
    });
  });
}
async function dupJob(id){
  const r = await fetch('/api/job?id='+encodeURIComponent(id));
  state = await r.json(); currentId=null; delete state._id; delete state._saved_at;
  state.cust_name=state.cust_name; // keep; user can change
  state.equipment_items=state.equipment_items||[{desc:'',amount:''}];
  state.freight_items=state.freight_items||[{desc:'',amount:''}];
  fillForm(); closeDrawer(); toast('Duplicated — saved as new on next Save');
}
async function delJob(id){
  if(!confirm('Delete this quote permanently?')) return;
  await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  if(currentId===id) currentId=null;
  allJobs=allJobs.filter(j=>j.id!==id); renderJobs(allJobs); toast('Deleted');
}

// ---- toast ----
let toastTimer;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ---- wire up ----
$('addEq').addEventListener('click',()=>{state.equipment_items.push({desc:'',amount:''});renderItems('eq');syncPreview();});
$('addFr').addEventListener('click',()=>{state.freight_items.push({desc:'',amount:''});renderItems('fr');syncPreview();});
$('btnNew').addEventListener('click',()=>{if(confirm('Start a new blank quote? Unsaved changes will be lost.'))loadDefaults();});
$('btnJobs').addEventListener('click',openDrawer);
$('closeDrawer').addEventListener('click',closeDrawer);
$('overlay').addEventListener('click',closeDrawer);
$('btnSave').addEventListener('click',()=>saveQuote(false));
$('btnPdf').addEventListener('click',()=>download('pdf'));
$('btnDocx').addEventListener('click',()=>download('docx'));
$('jobSearch').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  renderJobs(allJobs.filter(j=>(
    (j.cust_company||'')+(j.cust_name||'')+(j.machine||'')+(j.rep_name||'')
  ).toLowerCase().includes(q)));
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();saveQuote(false);}
});

bindFields();
loadDefaults();
</script>
</body>
</html>
